<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Boodschappenlijst</title>
  <style>
    [hidden] { display: none; }
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 1rem;
      max-width: 30rem;
      margin-inline: auto;
    }
    h1 { font-size: 1.5rem; }

    /* Home screen */
    .menu {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-top: 2rem;
    }
    .menu-button {
      display: block;
      padding: 1.5rem 1rem;
      font-size: 1.3rem;
      text-align: center;
      text-decoration: none;
      color: #fff;
      background: #2e7d32;
      border-radius: 0.75rem;
    }

    /* Back link on subpages */
    .back-link {
      display: inline-block;
      padding: 0.5rem 0;
      font-size: 1.1rem;
      color: #2e7d32;
      text-decoration: none;
    }

    /* Groceries page */
    form { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
    input[type="text"] {
      flex: 1;
      font-size: 1.1rem;
      padding: 0.7rem;
    }
    button { font-size: 1.1rem; padding: 0.7rem 1rem; }
    .status { color: #666; }
    ul { list-style: none; padding: 0; }
    li {
      display: flex;
      align-items: center;
      border-bottom: 1px solid #ddd;
    }
    .text {
      flex: 1;
      padding: 0.9rem 0.75rem;
      font-size: 1.1rem;
      cursor: pointer;
    }
    li.done .text { text-decoration: line-through; color: #888; }
    .remove {
      background: none;
      border: none;
      font-size: 1.5rem;
      color: #b00;
      padding: 0.5rem 0.9rem;
    }
  </style>
</head>
<body>

  <!-- View: home screen -->
  <section id="view-home">
    <h1>Welkom</h1>
    <nav class="menu">
      <a class="menu-button" href="#/groceries">Boodschappen</a>
      <a class="menu-button" href="#/option-2">Optie 2</a>
    </nav>
  </section>

  <!-- View: groceries -->
  <section id="view-groceries" hidden>
    <a class="back-link" href="#/">← Terug</a>
    <h1>Boodschappen</h1>

    <form id="add-form">
      <input type="text" id="new-item" placeholder="Voeg een item toe" autocomplete="off">
      <button type="submit">Toevoegen</button>
    </form>

    <p id="status" class="status">Laden…</p>
    <ul id="list"></ul>
  </section>

  <!-- View: option 2 (placeholder) -->
  <section id="view-option-2" hidden>
    <a class="back-link" href="#/">← Terug</a>
    <h1>Optie 2</h1>
    <p>Deze pagina is nog leeg.</p>
  </section>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
    import {
      getFirestore, collection, addDoc, updateDoc, deleteDoc,
      doc, onSnapshot, query, orderBy, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

    // ---------- Firebase ----------
    // This config is an identifier, not a password. The list is protected
    // by the security rules and sign-in we add in step 7.
    const firebaseConfig = {
      apiKey: "AIzaSyA1JnfXqFbTLJZHy6ezOnxAf9HgKsyGIZM",
      authDomain: "grocery-list-a6627.firebaseapp.com",
      projectId: "grocery-list-a6627",
      storageBucket: "grocery-list-a6627.firebasestorage.app",
      messagingSenderId: "956088734560",
      appId: "1:956088734560:web:2c9f12b2ca46b5006bc405"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const itemsCollection = collection(db, "groceryItems");

    // ---------- Navigation ----------
    // The part of the address after "#/" decides which view is shown.
    const viewNames = ["home", "groceries", "option-2"];

    function showView() {
      let name = location.hash.replace("#/", "");
      if (!viewNames.includes(name)) name = "home";
      for (const viewName of viewNames) {
        document.getElementById("view-" + viewName).hidden = (viewName !== name);
      }
    }

    window.addEventListener("hashchange", showView);
    showView();

    // ---------- Groceries ----------
    let items = [];

    const list = document.getElementById("list");
    const form = document.getElementById("add-form");
    const input = document.getElementById("new-item");
    const status = document.getElementById("status");

    function showError(error) {
      console.error(error);
      status.textContent = "Er ging iets mis. Probeer het opnieuw.";
    }

    function render() {
      list.innerHTML = "";
      for (const item of items) {
        const li = document.createElement("li");
        if (item.done) li.classList.add("done");

        const text = document.createElement("span");
        text.className = "text";
        text.textContent = item.text;
        text.addEventListener("click", () => {
          updateDoc(doc(db, "groceryItems", item.id), { done: !item.done })
            .catch(showError);
        });

        const remove = document.createElement("button");
        remove.className = "remove";
        remove.textContent = "×";
        remove.setAttribute("aria-label", "Verwijder " + item.text);
        remove.addEventListener("click", () => {
          deleteDoc(doc(db, "groceryItems", item.id)).catch(showError);
        });

        li.appendChild(text);
        li.appendChild(remove);
        list.appendChild(li);
      }
    }

    // Live updates: runs now and again whenever the list changes
    // (also when the other phone changes something).
    onSnapshot(
      query(itemsCollection, orderBy("createdAt")),
      (snapshot) => {
        items = snapshot.docs.map((d) => ({ id: d.id, ...d.data() }));
        status.textContent = items.length === 0 ? "De lijst is leeg." : "";
        render();
      },
      (error) => {
        console.error(error);
        status.textContent = "De lijst kan niet worden geladen.";
      }
    );

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const value = input.value.trim();
      if (value === "") return;
      input.value = "";
      addDoc(itemsCollection, {
        text: value,
        done: false,
        createdAt: serverTimestamp()
      }).catch(showError);
    });
  </script>
</body>
</html>
